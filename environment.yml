# Conda environment for the urease provenance audit.
#   conda env create -f environment.yml && conda activate urease-audit
name: urease-audit
channels:
  - conda-forge
dependencies:
  - python=3.12
  - rdkit>=2023.9
  - scikit-learn>=1.3
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.10
  - joblib>=1.3
  - matplotlib>=3.7
  - pyarrow>=14.0
  - openpyxl>=3.1
  - streamlit>=1.30
  - pytest>=7.4
  # needed only to refit models from scratch, not to reproduce the published tables
  - xgboost>=2.0
  - lightgbm>=4.0
  - shap>=0.44
  - umap-learn>=0.5
  - statsmodels>=0.14

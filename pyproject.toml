[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urease-provenance-audit"
version = "1.0.0"
description = "Applicability-domain-aware urease inhibitor cascade and provenance audit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "rdkit>=2023.9",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "joblib>=1.3",
  "streamlit>=1.30",
  "matplotlib>=3.7",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "xgboost>=2.0", "lightgbm>=4.0", "shap>=0.44", "umap-learn>=0.5", "statsmodels>=0.14"]

[project.scripts]
urease-predict = "app.predict:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ureaseaudit", "app"]
